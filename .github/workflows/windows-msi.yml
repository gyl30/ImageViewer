name: Windows MSI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 安装 Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.9.3
          arch: win64_msvc2022_64
          modules: qtimageformats
      - name: 配置 MSVC 运行库环境
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw 'Visual Studio installation was not found' }
          $vcvars = Join-Path $vsPath 'VC/Auxiliary/Build/vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "MSVC environment script is missing: $vcvars" }
          $variables = & $env:ComSpec /d /s /c "call `"$vcvars`" >nul && set"
          $redistDir = $variables | Where-Object { $_.StartsWith('VCToolsRedistDir=') } | Select-Object -First 1
          if (-not $redistDir) { throw 'MSVC did not define VCToolsRedistDir' }
          Add-Content -Path $env:GITHUB_ENV -Value $redistDir
      - name: 配置 Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCPACK_GENERATOR=WIX
      - name: 编译并运行 Qt 测试
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
      - name: 输出 Windows Qt 测试失败用例
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\build\Release\imageviewer_tests.exe -v1 -o windows-tests.txt,txt
      - name: 保存 Windows 测试失败日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-test-failure-log
          path: |
            build/Testing/Temporary/LastTest.log
            windows-tests.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: 部署 Qt 运行库并检查启动
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'ImageViewer-stage'
          cmake --install build --config Release --prefix $stage
          $exe = Join-Path $stage 'bin/ImageViewer.exe'
          $image = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($image, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($image, $peOffset + 92)
          if ($subsystem -ne 2) { throw "Expected a Windows GUI executable (subsystem 2), got $subsystem" }
          foreach ($plugin in @(
            'platforms/qwindows.dll',
            'imageformats/qwebp.dll',
            'iconengines/qsvgicon.dll'
          )) {
            if (-not (Test-Path (Join-Path $stage "bin/$plugin"))) {
              throw "Qt plugin missing from deployment: $plugin"
            }
          }
          foreach ($runtime in @('MSVCP140.dll', 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll')) {
            if (-not (Test-Path (Join-Path $stage "bin/$runtime"))) {
              throw "MSVC runtime missing from deployment: $runtime"
            }
          }
          $originalPath = $env:PATH
          $env:PATH = "$(Join-Path $stage 'bin');$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          try {
            $version = & $exe --version
            if ($LASTEXITCODE -ne 0) { throw "Deployed application failed to start: $version" }
            Write-Output $version
          } finally {
            $env:PATH = $originalPath
          }
      - name: 生成 MSI
        run: cpack --config build/CPackConfig.cmake -C Release -G WIX -B dist --verbose
      - name: 验证 MSI 安装与桌面快捷方式
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'dist/imageviewer-0.1.0-win64.msi').Path
          $desktop = [Environment]::GetFolderPath('Desktop')
          if (-not (Test-Path $desktop)) {
            New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          }
          $shortcut = Join-Path $desktop 'ImageViewer.lnk'
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /L*v `"$env:RUNNER_TEMP\imageviewer-install.log`"" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI install failed with exit code $($install.ExitCode)" }
          if (-not (Test-Path $shortcut)) { throw "Desktop shortcut was not created: $shortcut" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if (-not (Test-Path $link.TargetPath)) { throw "Desktop shortcut target is missing: $($link.TargetPath)" }
          $launch = Start-Process -FilePath $link.TargetPath -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($launch.ExitCode -ne 0) { throw "Desktop shortcut target failed to start: $($link.TargetPath)" }
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /L*v `"$env:RUNNER_TEMP\imageviewer-uninstall.log`"" -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path $shortcut) { throw 'MSI uninstall did not remove the desktop shortcut' }
      - name: 保存 WiX 失败日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-WiX-failure-log
          path: dist/_CPack_Packages/win64/WIX/wix.log
          if-no-files-found: ignore
          retention-days: 7
      - name: 上传 MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ImageViewer-Windows-x64-MSI
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 14
